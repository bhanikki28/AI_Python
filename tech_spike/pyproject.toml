[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-gate"
version = "0.1.0"
description = "Sensitive data redaction and policy gate for text bound for AI models, logs or storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
pii-gate = "pii_gate.cli:main"
pii-gate-mcp = "pii_gate.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pii_gate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # Third-party notice from Starlette's test client; not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pii_gate", "evals"]
